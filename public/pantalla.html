<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turnero Hertz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F4F4F4;
            color: #111;
            overflow: hidden;
        }

        .pantalla {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 35px;
        }

        .logo {
            width: 380px;
            max-width: 80%;
            height: auto;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 40px;
            text-align: center;
        }

        .contenido {
            width: 100%;
            max-width: 1500px;
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 0.9fr 2fr;
            gap: 30px;
        }

        .ahora,
        .llamados {
            border: none;
            border-radius: 15px;
            padding: 25px;
            min-height: 0;
            background: white;
        }

        .ahora {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .ahora .titulo {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            margin-bottom: 0;
        }

        .numero-destacado {
            font-size: 110px;
            font-weight: bold;
            color: #FDD500;
            line-height: 1;
            margin-bottom: 30px;
        }

        .ubicacion-destacada {
            font-size: 28px;
            font-weight: bold;
            color: #FDD500;
        }

        .sin-destacado {
            font-size: 24px;
            color: #F4F4F4;
        }

        .llamados {
            display: flex;
            flex-direction: column;
        }

        .llamados .titulo {
            flex-shrink: 0;
            text-align: center;
            margin-bottom: 35px;
        }

        .lista-llamados {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            align-content: start;
            overflow: hidden;
        }

        .turno {
            border: 2px solid #111;
            border-radius: 12px;
            min-height: 150px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .turno .numero {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .turno .ubicacion {
            font-size: 18px;
            font-weight: bold;
        }

        .sin-llamados {
            grid-column: 1 / -1;
            align-self: center;
            justify-self: center;
            text-align: center;
            color: #666;
            font-size: 22px;
        }

        @media (max-width: 1100px) {
            .contenido {
                grid-template-columns: 1fr 1.5fr;
            }

            .lista-llamados {
                grid-template-columns: repeat(2, 1fr);
            }

            .numero-destacado {
                font-size: 85px;
            }
        }

        @media (max-width: 750px) {
            body {
                overflow: auto;
            }

            .pantalla {
                height: auto;
                min-height: 100vh;
            }

            .contenido {
                grid-template-columns: 1fr;
            }

            .ahora {
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

    <div class="pantalla">

        <img
            src="/main-logo.svg"
            alt="Hertz"
            class="logo"
        >

        <div class="contenido">

            <div class="ahora">

                <div class="titulo">
                    Ahora
                </div>

                <div
                    id="numeroDestacado"
                    class="numero-destacado"
                >
                    -
                </div>

                <div
                    id="ubicacionDestacada"
                    class="ubicacion-destacada"
                >
                    Esperando llamado
                </div>

            </div>

            <div class="llamados">

                <div class="titulo">
                    Ya llamados
                </div>

                <div
                    id="listaLlamados"
                    class="lista-llamados"
                ></div>

            </div>

        </div>

    </div>

    <script src="/pantalla.js"></script>

</body>
</html>
